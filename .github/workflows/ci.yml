name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Serve the production image
        run: |
          docker build -t portfolio-site:ci .
          docker run -d --name site -p 8080:8080 portfolio-site:ci
          timeout 30 sh -c 'until curl -sf http://localhost:8080/healthz >/dev/null; do sleep 1; done'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
